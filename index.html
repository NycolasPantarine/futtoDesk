<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuttoDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="login-page">

  <div class="login-container">

    <div class="login-brand">
      <div class="brand-logo">
        <span class="brand-icon">F</span>
      </div>
      <h1 class="brand-name">FuttoDesk</h1>
      <p class="brand-tagline">Central de atendimento Futto RH</p>
    </div>

    <div class="login-card">
      <h2 class="login-title">Entrar</h2>
      <p class="login-subtitle">Acesse com seu e-mail corporativo</p>

      <div id="login-error" class="alert alert-error" style="display:none;"></div>

      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input
          class="form-input"
          type="email"
          id="email"
          placeholder="seu@email.com.br"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input
          class="form-input"
          type="password"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <a href="pages/forgot-password.html" class="form-hint-link">Esqueci minha senha</a>
      </div>

      <button class="btn btn-primary btn-full" id="btn-login">
        <span id="btn-login-text">Entrar</span>
        <span id="btn-login-loading" style="display:none;">Entrando...</span>
      </button>
    </div>

    <p class="login-footer">
      FuttoDesk © 2026 · Futto RH
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
